[project]
name = "sistema-campanha-sorteios"
version = "2.0.2"
description = "Gestão de campanhas promocionais e sorteios — Complexo Comercial de Barcarena"
requires-python = ">=3.12"
# A Vercel instala as dependências a partir desta lista quando existe pyproject.toml.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.0",
    "segno>=1.6.0",
    "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[tool.vercel]
# A Vercel detecta o FastAPI e carrega este objeto como uma única função.
# Arquivos estáticos ficam em public/ e são servidos pela CDN da Vercel.
entrypoint = "app.main:app"

[tool.uv]
# Projeto de aplicação, não uma biblioteca: instalar só as dependências.
package = false
